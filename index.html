<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>全齡溫養課程報名</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <style>

        body { background-color: #f8f9fa; padding: 20px; font-family: "Microsoft JhengHei", sans-serif; }

        .container { max-width: 500px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: auto; }

        .btn-primary { background-color: #00b900; border: none; font-weight: bold; margin-top: 20px; }

        label { font-weight: bold; margin-top: 15px; }

        .name-hint { font-size: 0.8em; color: #ff4d4d; font-weight: normal; }

    </style>

</head>

<body>

    <div class="container">

        <h3 class="text-center mb-4">全齡溫養課程報名</h3>

        

        <div class="form-group">

            <label>姓名 <span class="name-hint">(請填寫正確大名，方便核對)</span></label>

            <input type="text" id="userName" class="form-control" placeholder="請輸入姓名">

        </div>

        

        <div class="form-group">

            <label>電話</label>

            <input type="tel" id="userPhone" class="form-control" placeholder="請輸入聯絡電話">

        </div>



        <div class="form-group">

            <label>報名課程</label>

            <select id="courseType" class="form-control">

                <option value="">載入課程中...</option>

            </select>

        </div>



        <div class="form-group">

            <label>選擇場次</label>

            <select id="courseDate" class="form-control">

                <option value="">請先選擇課程</option>

            </select>

        </div>



        <input type="hidden" id="payMethod" value="轉帳匯款">



        <button id="submitBtn" class="btn btn-primary btn-block" disabled>正在初始化系統...</button>

    </div>



    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script>

        // 【修改註記】刪除原本寫死的 dateMap，改為全域動態變數接收 GAS 資料

        let allActiveEvents = []; 

        const gasUrl = 'https://script.google.com/macros/s/AKfycbw_EPUH4-FnKPxtLTZSh6mPh18ptD9pbEDH47tvWHcBIJ5v7Eaw99CHS7BSSMbDwvc/exec';



        // 【修改註記】重構核心功能：網頁一開啟就去 GAS 撈取最新場次資料並渲染

        async function fetchActiveEvents() {

            try {

                const response = await fetch(gasUrl);

                const data = await response.json();

                allActiveEvents = data; // 存下所有目前狀態為「上架」的 { course, date } 清單

                

                const selectCourseEl = document.getElementById('courseType');

                const selectDateEl = document.getElementById('courseDate');

                const submitBtn = document.getElementById('submitBtn');



                if (selectCourseEl && selectDateEl) {

                    // 1. 提取所有不重複的「課程名稱」填入選單

                    selectCourseEl.innerHTML = '<option value="">請選擇報名課程</option>';

                    const uniqueCourses = [...new Set(allActiveEvents.map(e => e.course))];

                    

                    uniqueCourses.forEach(course => {

                        let opt = document.createElement('option');

                        opt.value = course;

                        opt.innerHTML = course;

                        selectCourseEl.appendChild(opt);

                    });



                    // 2. 綁定二級聯動監聽：當使用者切換課程時，動態過濾對應的場次時間

                    selectCourseEl.onchange = function() {

                        selectDateEl.innerHTML = '<option value="">請選擇場次時間</option>';

                        const selectedCourse = this.value;

                        

                        // 過濾出屬於該選定課程的日期

                        const filteredDates = allActiveEvents.filter(e => e.course === selectedCourse);

                        filteredDates.forEach(ev => {

                            let opt = document.createElement('option');

                            opt.value = ev.date;

                            opt.innerHTML = ev.date;

                            selectDateEl.appendChild(opt);

                        });

                    };



                    // 啟用提交按鈕

                    submitBtn.disabled = false;

                    submitBtn.innerText = "確認提交";

                }

            } catch (err) {

                console.error("動態載入場次失敗:", err);

                alert("讀取最新場次資料失敗，請重新整理頁面。");

            }

        }



        let uID = "";

        async function initLIFF() {

            try {

                await liff.init({ liffId: "2009131497-Rq0Gbi7N" }); 

                if (!liff.isLoggedIn()) { 

                    liff.login(); 

                } else {

                    const profile = await liff.getProfile();

                    uID = profile.userId;

                    document.getElementById('userName').value = profile.displayName;

                    // 【修改註記】LIFF 載入成功後，開始抓取最新活動清單

                    await fetchActiveEvents(); 

                }

            } catch (err) { 

                // 網頁獨立瀏覽時的降級處理

                await fetchActiveEvents(); 

            }

        }

        initLIFF();



        document.getElementById('submitBtn').onclick = async function() {

            const name = document.getElementById('userName').value;

            const phone = document.getElementById('userPhone').value;

            const method = document.getElementById('payMethod').value;

            const courseName = document.getElementById('courseType').value; // 取得選中的完整課程名稱

            const date = document.getElementById('courseDate').value;



            if (!name || !phone || !courseName || !date) { alert('請填寫完整資訊並選擇場次'); return; }

            this.disabled = true;



            // 判斷金額（供原本 GAS 紀錄價格與統計使用）

            const price = courseName.includes("500") ? "500" : "2980";

            // 格式化報名項目名稱（保持你原本傳進試算表的「體驗班(時間)」或「精修班(時間)」格式）

            const activityType = courseName.includes("體驗班") ? "體驗班" : "精修班";



            try {

                await fetch(gasUrl, {

                    method: 'POST',

                    mode: 'no-cors',

                    body: JSON.stringify({

                        userId: uID, 

                        userName: name, 

                        phone: phone,

                        payMethod: method, 

                        activity: activityType + "(" + date + ")", 

                        price: price

                    })

                });

                

                alert('報名成功\n\n感謝您的報名\n\n請點擊〔確定〕返回對話視窗');

                

                if (liff.isInClient()) {

                    liff.closeWindow();

                } else {

                    window.close();

                }

            } catch (e) {

                alert('系統錯誤：' + e);

                this.disabled = false;

            }

        };

    </script>

</body>

</html>
