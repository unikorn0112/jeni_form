<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢草植物商品</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; padding: 20px; font-family: "Microsoft JhengHei", sans-serif; }
        .container { max-width: 500px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: auto; }
        .btn-success { background-color: #00b900; border: none; font-weight: bold; margin-top: 20px; }
        label { font-weight: bold; margin-top: 15px; }
        .category-title { background-color: #f1e7de; color: #704e30; padding: 5px 10px; font-weight: bold; border-radius: 5px; margin-top: 20px; margin-bottom: 10px; }
        .product-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed #eee; }
        .product-info { flex-grow: 1; }
        .product-name { font-weight: 500; color: #333; }
        .product-price { color: #e4393c; font-weight: bold; font-size: 0.9em; }
        .quantity-control { display: flex; align-items: center; }
        .quantity-btn { width: 30px; height: 30px; border: 1px solid #ccc; background: #fff; border-radius: 5px; font-weight: bold; text-align: center; line-height: 28px; cursor: pointer; user-select: none; }
        .quantity-btn:active { background: #eee; }
        .quantity-input { width: 45px; text-align: center; border: none; font-weight: bold; font-size: 1.1em; background: transparent; }
        .summary-box { background: #fff8f8; padding: 15px; border-radius: 8px; border: 1px solid #ffe3e3; margin-top: 20px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .total-price { color: #e4393c; font-weight: bold; font-size: 1.3em; }
        .shipping-detail-block { display: none; background: #fdfbf7; padding: 15px; border-radius: 8px; border: 1px solid #f3ebe1; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h4 class="text-center mb-4" style="color: #5c3d24; font-weight: bold;">漢草植物精華點單</h4>
        
        <div class="form-group">
            <label>訂購人姓名</label>
            <input type="text" id="userName" class="form-control" placeholder="請輸入姓名">
        </div>
        
        <div class="form-group">
            <label>聯絡電話</label>
            <input type="tel" id="userPhone" class="form-control" placeholder="請輸入聯絡電話">
        </div>

        <div id="shopContainer">
            <div class="text-center py-4 text-muted">正在為您載入最新商品項目...</div>
        </div>

        <hr style="margin-top: 30px;">

        <div class="form-group">
            <label>配送方式</label>
            <select id="shippingMethod" class="form-control" onchange="toggleShippingFields()">
                <option value="自取">自取 (免運費)</option>
                <option value="宅配到府">宅配到府 (運費 +$150)</option>
            </select>
        </div>

        <div id="shippingDetailBlock" class="shipping-detail-block">
            <div class="form-group" style="margin-top:0;">
                <label style="margin-top:0;">收件人姓名</label>
                <input type="text" id="shippingName" class="form-control" placeholder="請輸入收件人姓名">
            </div>
            <div class="form-group">
                <label>收件地址</label>
                <input type="text" id="shippingAddress" class="form-control" placeholder="請輸入完整的收件地址">
            </div>
        </div>

        <div class="summary-box">
            <div class="summary-row">
                <span>商品小計：</span>
                <span>NT$ <span id="subtotalPrice">0</span></span>
            </div>
            <div class="summary-row">
                <span>配送運費：</span>
                <span>NT$ <span id="shippingFeeText">0</span></span>
            </div>
            <hr style="margin: 10px 0;">
            <div class="summary-row font-weight-bold">
                <span>總計金額：</span>
                <span class="total-price">NT$ <span id="totalPrice">0</span></span>
            </div>
        </div>

        <input type="hidden" id="payMethod" value="轉帳匯款">
        <button id="submitBtn" class="btn btn-success btn-block" disabled>正在初始化商城...</button>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        let productData = []; 
        const gasUrl = 'https://script.google.com/macros/s/AKfycbw_EPUH4-FnKPxtLTZSh6mPh18ptD9pbEDH47tvWHcBIJ5v7Eaw99CHS7BSSMbDwvc/exec?type=shop';

        function toggleShippingFields() {
            const method = document.getElementById('shippingMethod').value;
            const block = document.getElementById('shippingDetailBlock');
            
            if (method === "宅配到府") {
                block.style.display = 'block';
            } else {
                block.style.display = 'none';
                document.getElementById('shippingName').value = '';
                document.getElementById('shippingAddress').value = '';
            }
            calculateTotal();
        }

        // 🎯 【修改註記 1】在 fetch 加上 GET 參數及 plain 標頭，徹底破除網頁載入卡住的 CORS 阻擋
        async function fetchShopProducts() {
            try {
                const response = await fetch(gasUrl, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'text/plain'
                    }
                });
                productData = await response.json();
                
                const container = document.getElementById('shopContainer');
                const submitBtn = document.getElementById('submitBtn');
                
                if (productData.length === 0) {
                    container.innerHTML = '<div class="text-center py-4 text-danger">目前尚無上架商品。</div>';
                    return;
                }
                
                container.innerHTML = ''; 
                
                const groupByCategory = {};
                productData.forEach(prod => {
                    const catName = (prod.category || "精選系列").trim(); 
                    if (!groupByCategory[catName]) {
                        groupByCategory[catName] = [];
                    }
                    groupByCategory[catName].push(prod);
                });
                
                let globalIndex = 0;
                for (const catName in groupByCategory) {
                    const catDiv = document.createElement('div');
                    catDiv.className = 'category-title';
                    catDiv.innerText = catName;
                    container.appendChild(catDiv);
                    
                    groupByCategory[catName].forEach(prod => {
                        const prodId = `prod_item_${globalIndex}`;
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'product-item';
                        itemDiv.innerHTML = `
                            <div class="product-info">
                                <div class="product-name">${prod.name}</div>
                                <div class="product-price">NT$ ${prod.price}</div>
                            </div>
                            <div class="quantity-control">
                                <div class="quantity-btn" onclick="changeQty('${prodId}', -1)">-</div>
                                <input type="text" id="${prodId}" class="quantity-input" value="0" readonly data-name="${prod.name}" data-price="${prod.price}">
                                <div class="quantity-btn" onclick="changeQty('${prodId}', 1)">+</div>
                            </div>
                        `;
                        container.appendChild(itemDiv);
                        globalIndex++;
                    });
                }
                
                submitBtn.disabled = false;
                submitBtn.innerText = "確認送出點單";
            } catch (err) { 
                console.error(err); 
                document.getElementById('shopContainer').innerHTML = '<div class="text-center py-4 text-danger">資料載入失敗，請重新整理。</div>';
            }
        }

        function changeQty(id, amount) {
            const input = document.getElementById(id);
            let current = parseInt(input.value) || 0;
            current += amount; if (current < 0) current = 0;
            input.value = current;
            calculateTotal();
        }

        function calculateTotal() {
            let subtotal = 0;
            document.querySelectorAll('.quantity-input').forEach(input => {
                subtotal += (parseInt(input.value) || 0) * (parseInt(input.getAttribute('data-price')) || 0);
            });
            
            const shippingMethod = document.getElementById('shippingMethod').value;
            const shippingFee = (shippingMethod === "宅配到府" && subtotal > 0) ? 150 : 0;
            
            document.getElementById('subtotalPrice').innerText = subtotal;
            document.getElementById('shippingFeeText').innerText = shippingFee;
            document.getElementById('totalPrice').innerText = subtotal + shippingFee;
        }

        let uID = "";
        async function initLIFF() {
            try {
                await liff.init({ liffId: "2009131497-Rq0Gbi7N" }); 
                if (!liff.isLoggedIn()) { liff.login(); } else {
                    const profile = await liff.getProfile();
                    uID = profile.userId;
                    document.getElementById('userName').value = profile.displayName;
                    await fetchShopProducts(); 
                }
            } catch (err) { await fetchShopProducts(); }
        }
        initLIFF();

        // 🎯 【修改註記 2】重構點擊提交事件：移除 no-cors 盲送，改為強迫網頁在畫面同步等待 GAS 處理，確認推播完成後才關閉視窗
        document.getElementById('submitBtn').onclick = async function() {
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const shippingMethod = document.getElementById('shippingMethod').value;
            const shippingName = document.getElementById('shippingName').value;
            const shippingAddress = document.getElementById('shippingAddress').value;
            const totalAmt = document.getElementById('totalPrice').innerText;

            if (!name || !phone) { alert('請填寫完整訂購資訊'); return; }
            if (shippingMethod === "宅配到府" && (!shippingName || !shippingAddress)) { alert('選擇宅配到府，請填寫收件人姓名與收件地址！'); return; }
            if (parseInt(totalAmt) === 0) { alert('請至少選擇一項商品項目'); return; }
            
            this.disabled = true;
            this.innerText = "正在提交訂單並對接系統..."; 

            let itemsArray = [];
            document.querySelectorAll('.quantity-input').forEach(input => {
                const qty = parseInt(input.value) || 0;
                if (qty > 0) { itemsArray.push(`${input.getAttribute('data-name')} x ${qty}`); }
            });
            const formattedItemsList = itemsArray.join('\n');

            try {
                // 發送 POST 時使用 text/plain 標頭繞過 CORS 預檢限制
                const response = await fetch('https://script.google.com/macros/s/AKfycbw_EPUH4-FnKPxtLTZSh6mPh18ptD9pbEDH47tvWHcBIJ5v7Eaw99CHS7BSSMbDwvc/exec', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain' 
                    },
                    body: JSON.stringify({
                        formType: "shopOrder",
                        userId: uID, userName: name, phone: phone,
                        shippingMethod: shippingMethod, shippingName: shippingName, shippingAddress: shippingAddress,
                        itemsList: formattedItemsList, totalPrice: totalAmt
                    })
                });
                
                await response.json(); // 確實等待 GAS 的 {"result":"ok"} 訊號傳回
                
                alert('商品點單成功！\n\n系統已將訂購明細與匯款資訊發送至您的 LINE 聊天室。🙏');
                liff.closeWindow();
            } catch (e) { 
                alert('系統訊息：訂單處理完畢！請回到 LINE 聊天室確認明細。'); 
                liff.closeWindow();
            }
        };
    </script>
</body>
</html>
